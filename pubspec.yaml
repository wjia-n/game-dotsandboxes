name: dotsandboxes
description: Dots and Boxes by Wajiha - wooden toy box edition.
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  shared_preferences: ^2.5.0
  cupertino_icons: ^1.0.8
  in_app_purchase: ^3.2.0
  qr_flutter: '>=4.1.0 <5.0.0'
  mobile_scanner: '>=5.2.3 <6.0.0'
  file_picker: '>=13.0.0 <14.0.0'
  path_provider: '>=2.1.4 <3.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/dotsandboxes_logo.png
    - assets/wajiha_logo.png

  fonts:
    - family: Comfortaa
      fonts:
        - asset: assets/fonts/Comfortaa.ttf
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand.ttf
